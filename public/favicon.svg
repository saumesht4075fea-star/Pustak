<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark polished background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#020203" />
    </linearGradient>

    <!-- Glowing orange/amber border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Gold/Amber fiery page gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background squircle with premium outer neon gradient border -->
  <rect x="20" y="20" width="472" height="472" rx="140" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner Ambient Glow to make the icon pop -->
  <circle cx="256" cy="256" r="190" fill="url(#ringGlow)" />

  <g transform="translate(0, 5)">
    <!-- THE BOOK COVER (Backing shadow representation of the book leather cover) -->
    <path 
      d="M 256 125 
         C 215 110, 130 110, 64 128 
         A 4 4 0 0 0 60 132 
         L 60 368 
         C 130 350, 215 350, 256 365 
         C 297 350, 382 350, 452 368 
         A 4 4 0 0 0 456 364
         L 456 132
         A 4 4 0 0 0 452 128
         C 382 110, 297 110, 256 125 Z" 
      fill="none" 
      stroke="#4b5563" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.5"
    />

    <!-- THE DETAILED PRIMARY OPEN BOOK LAYOUT (Strong clean strokes like Lucide but premiumized with fiery gradient and secondary page sheets) -->
    
    <!-- Underlay Second Page Sheet (Stacked Pages Style) -->
    <path 
      d="M 256 135 
         C 215 120, 130 120, 72 138 
         L 72 358 
         C 130 340, 215 340, 256 355 
         C 297 340, 382 340, 440 358 
         L 440 138 
         C 382 120, 297 120, 256 135 Z" 
      fill="none" 
      stroke="url(#bookGrad)" 
      stroke-width="4" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.6"
    />

    <!-- Main Front Pages (Glorious High-Contrast Outline & Fill combo) -->
    <!-- Left open page -->
    <path 
      d="M 76 142 
         C 135 125, 215 125, 250 140 
         L 250 346 
         C 215 331, 135 331, 76 348 
         Z" 
      fill="none" 
      stroke="url(#bookGrad)" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Right open page -->
    <path 
      d="M 436 142 
         C 377 125, 297 125, 262 140 
         L 262 346 
         C 297 331, 377 331, 436 348 
         Z" 
      fill="none" 
      stroke="url(#bookGrad)" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Central Glowing Spine Divider and bookmark ribbon -->
    <!-- Beautiful crimson/gold accent ribbon -->
    <path 
      d="M 256 120 
         L 256 385 
         L 242 370 
         L 228 385 
         L 228 120 Z" 
      fill="url(#bookGrad)" 
      opacity="0.9"
    />

    <!-- Elegant horizontal lines simulating lines of premium text (curved matching pages) -->
    <path d="M 110 185 C 145 174, 195 174, 216 181" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4" />
    <path d="M 110 225 C 145 214, 195 214, 216 221" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4" />
    <path d="M 110 265 C 145 254, 195 254, 216 261" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4" />
    <path d="M 110 305 C 145 294, 180 294, 200 299" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4" />

    <path d="M 402 185 C 367 174, 317 174, 296 181" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4" />
    <path d="M 402 225 C 367 214, 317 214, 296 221" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4" />
    <path d="M 402 265 C 367 254, 317 254, 296 261" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4" />
    <path d="M 402 305 C 367 294, 332 294, 312 299" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
