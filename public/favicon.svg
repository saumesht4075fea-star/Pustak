<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Orange to Gold brand gradient -->
    <linearGradient id="pustakOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <!-- Soft glow filter for high-end professional appearance -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- High-quality transparent background, focused entirely on the beautiful glowing corporate icon -->
  <g filter="url(#glow)">
    <!-- Main Book Shape: thick, clean lines and elegant curves -->
    <path 
      d="M256,410 C180,380 90,380 40,400 L40,110 C90,90 180,90 256,120 C332,90 422,90 472,110 L472,400 C422,380 332,380 256,410 Z" 
      fill="url(#pustakOrange)"
    />
    <!-- The elegant page separation in the center -->
    <path 
      d="M256,120 L256,410" 
      stroke="#ffffff" 
      stroke-width="16" 
      stroke-linecap="round" 
      opacity="0.95"
    />
    <!-- Left page accent lines (Inner carving to show open book texture) -->
    <path 
      d="M100,180 C140,165 200,165 230,175 M100,240 C140,225 200,225 230,235 M100,300 C140,285 200,285 230,295" 
      stroke="#ffffff" 
      stroke-width="12" 
      stroke-linecap="round" 
      opacity="0.4"
    />
    <!-- Right page accent lines -->
    <path 
      d="M412,180 C372,165 312,165 282,175 M412,240 C372,225 312,225 282,235 M412,300 C372,285 312,285 282,295" 
      stroke="#ffffff" 
      stroke-width="12" 
      stroke-linecap="round" 
      opacity="0.4"
    />
  </g>
</svg>
